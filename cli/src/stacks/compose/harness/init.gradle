// Motif's Gradle init script for Compose screenshots (decision 0008). Motif writes it, unchanged from run to run, to
// <module>/.motif/shot/init.gradle and runs `gradlew :<module>:motifShots -I <module>/.motif/shot/init.gradle` from the
// project's root. It changes that run only, and only the module it sits in (found from the script's own path):
// .motif/shot/src becomes a unit-test source folder, the test libraries are added, Android resources are made visible to
// unit tests, and the unit-test tasks are told where the harness's options are, run only the harness, and always run.
// motifShots runs the unit tests of the variant Android Studio selects by default: testDebugUnitTest, or
// testDemoDebugUnitTest in an app with product flavours, which has no testDebugUnitTest. The developer's build files are never edited. Groovy rather than Kotlin: the Android plugin isn't on
// an init script's classpath, and Groovy reaches its DSL (android { … }) without it.

def motifModuleDir = initscript.sourceFile.parentFile.parentFile.parentFile.canonicalFile

// Robolectric downloads its Android jar itself, from Maven Central, outside Gradle's repositories and proxy settings.
// What the developer gave Gradle is passed on to it: robolectric.dependency.* and robolectric.offline system properties
// (systemProp.… in gradle.properties: a mirror, a proxy, a local folder); else Gradle's own HTTPS proxy
// (systemProp.https.proxyHost and proxyPort); else the HTTPS_PROXY environment variable.
def robolectricDownload = [:]
System.properties.each { key, value ->
    def name = key.toString()
    if (name.startsWith("robolectric.dependency.") || name == "robolectric.offline") robolectricDownload[name] = value.toString()
}
if (!robolectricDownload["robolectric.dependency.proxy.host"]) {
    def host = System.getProperty("https.proxyHost")
    def port = System.getProperty("https.proxyPort") ?: "443"
    if (!host) {
        def proxy = System.getenv("HTTPS_PROXY") ?: System.getenv("https_proxy")
        if (proxy) {
            try {
                def uri = new URI(proxy.contains("://") ? proxy : "http://" + proxy)
                host = uri.host
                port = uri.port > 0 ? uri.port.toString() : (uri.scheme == "https" ? "443" : "80")
            } catch (URISyntaxException ignored) {
                // Not a URL: Robolectric goes direct.
            }
        }
    }
    if (host) {
        robolectricDownload["robolectric.dependency.proxy.host"] = host
        robolectricDownload["robolectric.dependency.proxy.port"] = port
    }
}

allprojects { project ->
    if (project.projectDir.canonicalFile != motifModuleDir) return
    project.pluginManager.withPlugin("com.android.application") {
        def shotDir = new File(motifModuleDir, ".motif/shot")
        // The variant Android Studio selects by default, as the Android plugin computes it (VariantModelImpl's
        // computeDefaultVariant, AGP 8 and 9): the build type marked isDefault, then the most flavours marked isDefault
        // (one per dimension, the first by name when several are), then the test build type (debug unless testBuildType
        // says), then the flavours by name, dimension by dimension; on a tie, the variant the plugin made first. Only
        // variants with unit tests count: a variant whose unit tests are switched off has no task to run.
        def defaultBuildType = null
        def defaultFlavors = [:]
        def testBuildType = "debug"
        def candidates = []
        project.androidComponents.onVariants(project.androidComponents.selector().all()) { variant ->
            if (variant.hasProperty("unitTest") && variant.unitTest == null) return
            def task = "test" + variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1) + "UnitTest"
            candidates << [name: variant.name, task: task, buildType: variant.buildType, flavors: variant.productFlavors.collect { [it.first, it.second] }]
        }
        def rank = { c ->
            [
                defaultBuildType != null && c.buildType == defaultBuildType ? 0 : 1,
                -c.flavors.count { defaultFlavors[it[0]] == it[1] },
                c.buildType == testBuildType ? 0 : 1,
            ]
        }
        def better = { a, b ->
            def ra = rank(a)
            def rb = rank(b)
            for (int i = 0; i < ra.size(); i++) if (ra[i] != rb[i]) return ra[i] < rb[i]
            for (int i = 0; i < Math.min(a.flavors.size(), b.flavors.size()); i++) {
                def order = a.flavors[i][1].compareTo(b.flavors[i][1])
                if (order != 0) return order < 0
            }
            false
        }
        def chosen = null
        def choose = {
            if (chosen == null) {
                candidates.each { c -> if (chosen == null || better(c, chosen)) chosen = c }
            }
            chosen
        }
        // What Motif runs. Which test task it depends on is read once the variants are known.
        project.tasks.register("motifShots") { task ->
            task.description = "Draws Motif's screenshots (added by Motif for one run)."
            task.dependsOn { choose()?.task ?: "testDebugUnitTest" }
        }
        // Before the Android plugin locks its DSL, after the module's own build file has set it.
        project.androidComponents.finalizeDsl { android ->
            // Under java and kotlin both: AGP 9's built-in Kotlin compiles only the kotlin folders.
            def tests = android.sourceSets.getByName("test")
            tests.java.srcDir(new File(shotDir, "src"))
            tests.kotlin.srcDir(new File(shotDir, "src"))
            android.testOptions.unitTests.includeAndroidResources = true
            // What the build marks as Android Studio's default. Groovy reads Kotlin's isDefault through isDefault():
            // the property of that name is getIsDefault(), a Provider object, which is always true as a condition.
            def marked = android.buildTypes.findAll { it.isDefault() }*.name.sort()
            if (marked) defaultBuildType = marked[0]
            // A flavour may leave its dimension out when the build has only one.
            def onlyDimension = android.flavorDimensions.size() == 1 ? android.flavorDimensions[0] : null
            android.productFlavors.findAll { it.isDefault() }.sort { it.name }.each { f ->
                def dimension = f.dimension ?: onlyDimension
                if (!defaultFlavors.containsKey(dimension)) defaultFlavors[dimension] = f.name
            }
            if (android.testBuildType) testBuildType = android.testBuildType
        }
        project.dependencies {
            // Compose's test libraries take the app's own Compose version (its BOM, or the version its Compose UI
            // resolves to: androidx keeps a group's libraries aligned); 1.9.0 is only preferred, for an app with neither.
            testImplementation("androidx.compose.ui:ui-test-junit4") { version { prefer "1.9.0" } }
            testImplementation("androidx.compose.ui:ui-test-manifest") { version { prefer "1.9.0" } }
            testImplementation "org.robolectric:robolectric:4.17"
            testImplementation "junit:junit:4.13.2"
            testImplementation "com.google.android.apps.common.testing.accessibility.framework:accessibility-test-framework:4.1.1"
        }
        // The harness is a JUnit 4 test (Robolectric's runner). On the JUnit Platform (useJUnitPlatform()) Gradle finds no
        // test in it without JUnit's vintage engine, which is added then, at the version of the app's own JUnit (Jupiter, or
        // its junit-bom), as its test dependencies declare it: JUnit's libraries must share one version, and a later
        // vintage engine would raise the app's Jupiter with it. With none declared, 5.13.4 is only preferred. Read once the
        // build file has set up the test task (after it is evaluated, and after the Android plugin has made its tasks).
        project.afterEvaluate {
            // Said for motif shot's notes when there was a choice beyond debug or release: product flavours, or a build
            // type other than debug.
            if (candidates.size() > 1 && choose() != null && (chosen.flavors || chosen.buildType != "debug")) {
                println "Motif draws the ${chosen.name} variant, of ${candidates*.name.join(", ")}."
                // The harness writes it into result.json: the line above can fall off the tail of Gradle's output, and a
                // reused configuration cache doesn't print it, but the task's system properties are cached with it.
                def drawing = project.tasks.findByName(chosen.task)
                if (drawing instanceof Test) {
                    drawing.systemProperty "motif.shot.variant", chosen.name
                    drawing.systemProperty "motif.shot.variants", candidates*.name.join(",")
                }
            }
        }
        project.afterEvaluate {
            def name = choose()?.task
            def test = name ? project.tasks.findByName(name) : null
            if (!(test instanceof Test) || !(test.options instanceof org.gradle.api.tasks.testing.junitplatform.JUnitPlatformOptions)) return
            def junit = null
            project.configurations.each { configuration ->
                if (!configuration.name.toLowerCase().contains("test")) return
                configuration.dependencies.each { d ->
                    if (junit == null && d.group in ["org.junit", "org.junit.jupiter", "org.junit.vintage"] && d.version ==~ /\d[\w.-]*/) junit = d.version
                }
            }
            if (junit) {
                project.dependencies.add("testRuntimeOnly", "org.junit.vintage:junit-vintage-engine:" + junit)
            } else {
                project.dependencies.add("testRuntimeOnly", "org.junit.vintage:junit-vintage-engine") { version { prefer "5.13.4" } }
            }
        }
        project.tasks.withType(Test).configureEach { test ->
            if (!test.name.toLowerCase().contains("unittest")) return
            test.systemProperty "motif.shot.config", new File(shotDir, "config.json").absolutePath
            test.systemProperty "robolectric.graphicsMode", "NATIVE"
            test.systemProperty "robolectric.pixelCopyRenderMode", "hardware"
            test.systemProperties robolectricDownload
            // Only the harness, as --tests would (which a task that isn't a test task can't be given), whatever the
            // build's own filter includes.
            test.setTestNameIncludePatterns(["dev.motif.shot.MotifShotTest"])
            // Every run draws again: the options change while the sources don't.
            test.outputs.upToDateWhen { false }
            test.outputs.cacheIf { false }
        }
    }
}
