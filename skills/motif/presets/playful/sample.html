<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playful — Motif</title>
</head>
<body>
  <div class="mk-stage">
    <div class="mk-frame mk-phone mk-ios">
      <div class="mk-status"><span>9:41</span><span>100%</span></div>
      <header class="mk-topbar">
        <span class="mk-heading">Today</span>
        <span class="mk-avatar">AR</span>
      </header>
      <main class="mk-screen mk-pad mk-stack">
        <section class="mk-card" data-enter="rise">
          <span class="mk-caption mk-muted">Balance</span>
          <span class="mk-display">2,480</span>
          <div class="mk-row-inline"><span class="mk-badge mk-success">+12% this week</span></div>
        </section>
        <div class="mk-list" data-enter="rise">
          <div class="mk-row">
            <span class="mk-avatar">GR</span>
            <div class="mk-grow"><div class="mk-body">Groceries</div><div class="mk-caption mk-muted">Today, 9:12</div></div>
            <span class="mk-label">−64</span>
          </div>
          <div class="mk-row">
            <span class="mk-avatar">CF</span>
            <div class="mk-grow"><div class="mk-body">Coffee</div><div class="mk-caption mk-muted">Yesterday, 8:40</div></div>
            <span class="mk-label">−6</span>
          </div>
          <div class="mk-row">
            <span class="mk-avatar">SL</span>
            <div class="mk-grow"><div class="mk-body">Salary</div><div class="mk-caption mk-muted">Monday</div></div>
            <span class="mk-label">+3,200</span>
          </div>
        </div>
        <div class="mk-row-inline" data-enter="rise">
          <button class="mk-btn mk-grow">Add money</button>
          <button class="mk-btn mk-secondary mk-grow">Send</button>
        </div>
      </main>
      <nav class="mk-tabbar">
        <span class="mk-tab mk-active"><span class="mk-icon"></span>Home</span>
        <span class="mk-tab"><span class="mk-icon"></span>Cards</span>
        <span class="mk-tab"><span class="mk-icon"></span>Insights</span>
        <span class="mk-tab"><span class="mk-icon"></span>Profile</span>
      </nav>
      <div class="mk-home"></div>
    </div>
  </div>
</body>
</html>
