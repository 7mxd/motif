name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, asset: motif-linux-x64, smoke: true }
          - { os: ubuntu-latest, target: bun-linux-arm64, asset: motif-linux-arm64, smoke: false }
          - { os: windows-latest, target: bun-windows-x64, asset: motif-windows-x64.exe, smoke: true }
          - { os: macos-latest, target: bun-darwin-arm64, asset: motif-darwin-arm64, smoke: true }
          - { os: macos-latest, target: bun-darwin-x64, asset: motif-darwin-x64, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.bun-version
      - name: Tag matches skill/VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(tr -d ' \r\n' < skill/VERSION)" = "$GITHUB_REF_NAME"
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: cli
        shell: bash
        run: mkdir -p ../dist && bun build --compile --minify --target=${{ matrix.target }} src/main.ts --outfile ../dist/${{ matrix.asset }}
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/${{ matrix.asset }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: test "$(./dist/${{ matrix.asset }} --version)" = "$(tr -d ' \r\n' < skill/VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.bun-version
      - name: Tag matches skill/VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(tr -d ' \r\n' < skill/VERSION)" = "$GITHUB_REF_NAME"
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Build and zip the Claude Code plugin (refuses a plugin.json version other than skill/VERSION)
        working-directory: cli
        run: |
          bun run plugin
          bun run plugin:zip
      - name: Build the package for other agents and the skill archives
        working-directory: cli
        run: |
          bun run packages
          bun run skill:archives
      - name: Every manifest carries the tag's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version dist/agents/plugin.json)" = "$v"
          test "$(jq -r .version dist/agents/gemini-extension.json)" = "$v"
      - name: Pack the plugins branch's files (keeps the bootstrap's executable flag)
        run: tar -czf dist/plugins-tree.tar.gz -C dist/agents .
      - uses: actions/upload-artifact@v4
        with:
          name: motif-claude-code.zip
          path: dist/motif-claude-code.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: motif-skill
          path: |
            dist/motif-skill.zip
            dist/motif-skill.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-tree
          path: dist/plugins-tree.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, plugin]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes exist
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: motif-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plugins-tree
          path: plugins-tree
      - name: Checksums
        working-directory: dist
        run: sha256sum motif-* > SHA256SUMS && cat SHA256SUMS
      - name: Notices
        run: cp THIRD-PARTY-NOTICES.txt dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Motif $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" $pre
      - name: Update the plugins branch, which every agent but Claude Code installs from
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in *-*) echo "A pre-release: the plugins branch stays as it is."; exit 0 ;; esac
          dir="$RUNNER_TEMP/plugins"
          if git ls-remote --exit-code --heads origin plugins >/dev/null; then
            git fetch --depth 1 origin plugins
            git worktree add --detach "$dir" FETCH_HEAD
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout -q --orphan plugins
          fi
          git -C "$dir" rm -rqf --ignore-unmatch .
          tar -xzf plugins-tree/plugins-tree.tar.gz -C "$dir"
          git -C "$dir" add -A
          git -C "$dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Motif $GITHUB_REF_NAME"
          git -C "$dir" push origin "HEAD:refs/heads/plugins"
          git -C "$dir" tag "plugins-$GITHUB_REF_NAME"
          git -C "$dir" push origin "refs/tags/plugins-$GITHUB_REF_NAME"

  check:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the plugin and the checksums from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern motif-claude-code.zip --pattern SHA256SUMS --dir release
      - name: The zip matches SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          grep ' motif-claude-code.zip$' SHA256SUMS > zip.sha256
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c zip.sha256; else shasum -a 256 -c zip.sha256; fi
      - name: Unpack (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unzip -q release/motif-claude-code.zip -d plugin
          # Claude Code may unpack the plugin without the executable flag; the skill runs the bootstrap with sh either way.
          chmod a-x plugin/skills/motif/bin/motif
      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path release/motif-claude-code.zip -DestinationPath plugin
      - name: The plugin's bootstrap fetches the tool from the release and runs it (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MOTIF_HOME: ${{ runner.temp }}/motif-home
        run: |
          unset MOTIF_BIN
          test "$(sh plugin/skills/motif/bin/motif --version)" = "${GITHUB_REF_NAME#v}"
          sh plugin/skills/motif/bin/motif doctor --json > doctor.json
          python3 -c 'import json; d = json.load(open("doctor.json")); assert d["command"] == "doctor" and d["ok"], d'
      - name: The plugin's bootstrap fetches the tool from the release and runs it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOTIF_HOME: ${{ runner.temp }}\motif-home
        run: |
          Remove-Item Env:MOTIF_BIN -ErrorAction SilentlyContinue
          $version = & .\plugin\skills\motif\bin\motif.cmd --version
          if ($version -ne $env:GITHUB_REF_NAME.Substring(1)) { throw "motif --version printed '$version'" }
          $json = & .\plugin\skills\motif\bin\motif.cmd doctor --json | Out-String
          $doctor = $json | ConvertFrom-Json
          if ($doctor.command -ne 'doctor' -or -not $doctor.ok) { throw "doctor --json printed: $json" }

  agents:
    needs: publish
    # A pre-release leaves the plugins branch as it was, so there's nothing new to check.
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODEX: 0.163.0
      COPILOT: 1.0.98
      GEMINI: 0.64.0
      OPENCODE: 1.19.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cli/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Install the agents' CLIs (no sign-in)
        shell: bash
        run: npm install -g "@openai/codex@$CODEX" "@github/copilot@$COPILOT" "@google/gemini-cli@$GEMINI" "opencode-ai@$OPENCODE"
      - name: Install the Cursor CLI (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the Cursor CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm 'https://cursor.com/install?win32=true' | iex
      - name: Each agent installs Motif from GitHub, lists its skill and runs its tool
        working-directory: cli
        run: bun scripts/agent-checks.ts --source github --doctor
