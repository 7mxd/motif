name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a branch (gh workflow run ci.yml --ref <branch>), e.g. to prove a toolchain floor before a merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: cli
        run: bun run typecheck
      - name: Test
        working-directory: cli
        run: bun test --timeout 120000

  # The Flutter tests skip in the job above (no Flutter there); this one runs them against the pinned SDK (docs/decisions/0007-flutter-rendering.md).
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      # Roboto and the Material icons come from the SDK's material_fonts folder, which a cached SDK can be missing.
      - name: Flutter's fonts
        run: flutter precache --force --no-android --no-ios --no-web --no-linux && ls "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" | head -3
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Flutter tests
        working-directory: cli
        run: bun test --timeout 300000 test/flutter-*.test.ts test/check-flutter.test.ts test/extract-flutter.test.ts test/fixtures-flutter.test.ts test/shot-flutter.test.ts test/tokens-flutter.test.ts

  # The React Native tests that run npm ci on an Expo app or start Expo's web target skip in the test job
  # (MOTIF_STACK_JOB is not set there); this one runs them. Node and Chrome are on the runner.
  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOTIF_STACK_JOB: react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cli/test/fixtures/expo-min/package-lock.json
            tests/fixtures/rn-contract-app/package-lock.json
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: React Native tests
        working-directory: cli
        run: bun test --timeout 600000 test/rn-*.test.ts test/check-rn.test.ts test/extract-rn.test.ts test/fixtures-rn.test.ts test/shot-rn.test.ts test/tokens-rn.test.ts

  # The oldest Flutter Motif supports (FLUTTER_MIN in cli/src/stacks/flutter/doctor.ts): a fresh flutter create app gets
  # the theme, passes flutter analyze, and is drawn and audited. The fixtures need a newer Dart, so only this test runs.
  flutter-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true
      - name: Flutter's fonts
        run: flutter precache --force --no-android --no-ios --no-web --no-linux && ls "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" | head -3
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: The fresh app on Flutter 3.27
        working-directory: cli
        run: bun test --timeout 600000 test/flutter-starter.test.ts

  # The Compose tests on the floor JDK (17), with the SDK set up by its action rather than the runner's own copy
  # (docs/decisions/0008-compose-rendering.md). The Gradle and Robolectric tests skip in the test job (MOTIF_STACK_JOB
  # names this job); the first run downloads Gradle, the Android plugin and Robolectric's Android jars (into ~/.m2).
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MOTIF_STACK_JOB: compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36
      # Gradle's downloads, and Robolectric's Android jar (~200 MB), which it puts in ~/.m2 itself.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2
          key: compose-${{ runner.os }}-${{ hashFiles('cli/test/fixtures/compose-*/gradle/libs.versions.toml', 'tests/fixtures/compose-*/gradle/libs.versions.toml', 'cli/test/fixtures/compose-*/gradle/wrapper/gradle-wrapper.properties', 'tests/fixtures/compose-*/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: compose-${{ runner.os }}-
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Compose tests
        working-directory: cli
        run: bun test --timeout 900000 test/compose-*.test.ts test/check-compose.test.ts test/extract-compose.test.ts test/fixtures-compose.test.ts test/shot-compose.test.ts test/tokens-compose.test.ts

  # The SwiftUI tests that build with Xcode and draw on a simulator skip elsewhere (MOTIF_STACK_JOB names this job). macos-15
  # rather than macos-latest: its image has Xcode 16.x (the floor, global constraint "Xcode 16"); the macos-26 image has only 26.x.
  # Xcode 16.4 is the newest 16.x on that image (runner-images, macos-15-arm64 README, Oct 2026); the step fails and lists
  # what is installed if the image drops it.
  swiftui:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MOTIF_STACK_JOB: swiftui
      XCODE: "16.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - name: Select Xcode ${{ env.XCODE }}
        run: |
          app="/Applications/Xcode_${XCODE}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $XCODE is not on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: SwiftUI tests
        working-directory: cli
        run: bun test --timeout 1800000 test/swiftui-*.test.ts test/check-swiftui.test.ts test/extract-swiftui.test.ts test/fixtures-swiftui.test.ts test/shot-swiftui.test.ts test/tokens-swiftui.test.ts
